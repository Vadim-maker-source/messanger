# nginx-конфиг внутри docker-compose.
# Подключается через docker volume в /etc/nginx/conf.d/default.conf
# Главное отличие от bare-metal — proxy_pass указывает на сервис `app`,
# а не на 127.0.0.1, потому что контейнеры общаются через docker-сеть.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Лимиты для аплоада видео
    client_max_body_size 250M;
    client_body_timeout 300s;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Socket.io
    location /socket.io/ {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_cache_bypass $http_upgrade;
    }

    # Next.js статика
    location /_next/static/ {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Всё остальное
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }
}

# HTTPS — раскомментируйте после получения сертификата.
# Сертификаты пробрасываются с хоста через volume `/etc/letsencrypt`.
#
