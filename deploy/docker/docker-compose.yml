# ════════════════════════════════════════════════════════════════
# Полный стек Talky — postgres + app + nginx + coturn
# ════════════════════════════════════════════════════════════════
# Использование (из корня репо):
#   cp deploy/docker/.env.example .env
#   nano .env                        # подставить пароли и ключи
#   docker compose -f deploy/docker/docker-compose.yml up -d
#
# Управление:
#   docker compose ps                # статус
#   docker compose logs -f app       # логи приложения
#   docker compose restart app       # рестарт одного сервиса
#   docker compose down              # остановить всё
#   docker compose down -v           # ⚠️ остановить + удалить тома (включая БД)
# ════════════════════════════════════════════════════════════════

services:
  # ─── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: messanger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-webMessanger}
      POSTGRES_USER: ${DB_USER:-messanger}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Не пробрасываем порт наружу — БД доступна только из docker-сети
    expose:
      - "5432"
    networks:
      - messanger-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-messanger} -d ${DB_NAME:-webMessanger}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Next.js приложение ──────────────────────────────────────
  app:
    build:
      context: ../..               # корень репо
      dockerfile: deploy/docker/Dockerfile
    container_name: messanger-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Для приложения БД — это сервис `postgres`, не localhost
      DATABASE_URL: postgresql://${DB_USER:-messanger}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-webMessanger}?schema=public
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      # Yandex Cloud
      YANDEX_ENDPOINT: ${YANDEX_ENDPOINT:-https://storage.yandexcloud.net}
      YANDEX_REGION: ${YANDEX_REGION:-ru-central1}
      YANDEX_BUCKET: ${YANDEX_BUCKET}
      YANDEX_ACCESS: ${YANDEX_ACCESS}
      YANDEX_SECRET: ${YANDEX_SECRET}
      # Pusher
      PUSHER_APP_ID: ${PUSHER_APP_ID}
      PUSHER_KEY: ${PUSHER_KEY}
      PUSHER_SECRET: ${PUSHER_SECRET}
      PUSHER_CLUSTER: ${PUSHER_CLUSTER}
      NEXT_PUBLIC_PUSHER_KEY: ${PUSHER_KEY}
      NEXT_PUBLIC_PUSHER_CLUSTER: ${PUSHER_CLUSTER}
      # Firebase для FCM push
      FIREBASE_SERVICE_ACCOUNT_KEY: ${FIREBASE_SERVICE_ACCOUNT_KEY}
      # TURN (через сервис coturn)
      TURN_URLS: ${TURN_URLS}
      TURN_USERNAME: ${TURN_USERNAME}
      TURN_CREDENTIAL: ${TURN_CREDENTIAL}
      # SMTP для email кодов
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
    expose:
      - "3000"
    networks:
      - messanger-net

  # ─── nginx ───────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: messanger-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Сертификаты Let's Encrypt — пробрасываем с хоста если есть
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - messanger-net

  # ─── coturn (TURN-сервер для WebRTC) ─────────────────────────
  # Особенность: host-режим обязателен для UDP-relay диапазона
  coturn:
    image: coturn/coturn:4.6
    container_name: messanger-coturn
    restart: unless-stopped
    network_mode: host           # обязательно для relay 49152-65535/udp
    volumes:
      - ./coturn.conf:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

# ────────────────────────────────────────────────────────────────
# Сеть для коммуникации между контейнерами
# ────────────────────────────────────────────────────────────────
networks:
  messanger-net:
    driver: bridge

# ────────────────────────────────────────────────────────────────
# Постоянное хранилище БД — переживает перезапуски и docker compose down
# Удаляется только через `docker compose down -v` или `docker volume rm`
# ────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
