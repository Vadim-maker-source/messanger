# ════════════════════════════════════════════════════════════════
# nginx — reverse proxy для Next.js + Socket.io
# ════════════════════════════════════════════════════════════════
#
# Расположение: /etc/nginx/sites-available/messanger
# Активация:    ln -s /etc/nginx/sites-available/messanger /etc/nginx/sites-enabled/
# Применение:   sudo nginx -t && sudo systemctl reload nginx
#
# После добавления домена и SSL — раскомментируйте HTTPS-блок в конце.
# ════════════════════════════════════════════════════════════════

# Map для WebSocket upgrade — нужно для socket.io
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;  # принимаем любой Host (или подставьте свой домен)

    # Лимиты — медиа в чате могут быть большие
    client_max_body_size 200M;

    # Логи
    access_log /var/log/nginx/messanger-access.log;
    error_log  /var/log/nginx/messanger-error.log warn;

    # ─── Socket.io: WebSocket upgrade ────────────────────────────
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;       # держим долго — Socket.io ping каждые 25с
        proxy_send_timeout 3600s;
        proxy_cache_bypass $http_upgrade;
    }

    # ─── Next.js статика — кешируем агрессивно ──────────────────
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        # Браузер кеширует на год (статика immutable от Next.js)
        expires 365d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # ─── Public файлы тоже кешируем (фавиконы, иконки) ──────────
    location /public/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
        access_log off;
    }

    # ─── Всё остальное — Next.js ────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}

# ════════════════════════════════════════════════════════════════
